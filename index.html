<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Micaela's Birthday Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --green:#6dff3a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: #050a06; color: #fff; font-family: 'Montserrat', sans-serif; overflow: hidden; }

  /* Fondo estilo DOOM: infierno carmesí + brillo verde tóxico, con aura de Bruja Escarlata */
  .bg {
    position: fixed; inset: 0;
    background:
      url("fondo.jpg") center/cover no-repeat,
      radial-gradient(ellipse 70% 45% at 50% 105%, rgba(255,60,20,.85) 0%, rgba(170,15,25,.55) 40%, transparent 75%),
      radial-gradient(ellipse 55% 40% at 50% 0%, rgba(90,255,80,.45) 0%, rgba(20,110,50,.3) 45%, transparent 75%),
      radial-gradient(ellipse 45% 60% at 0% 55%, rgba(200,20,50,.45) 0%, transparent 70%),
      radial-gradient(ellipse 45% 60% at 100% 55%, rgba(60,200,70,.35) 0%, transparent 70%),
      linear-gradient(#0a0305, #060a05);
  }
  /* humo de magia del caos girando despacio */
  .bg::after { content: ""; position: absolute; inset: -30%; opacity: .12; filter: blur(60px);
    background: conic-gradient(from 0deg at 50% 55%, #ff1f3d, transparent 18%, #4dff4d 32%, transparent 50%, #c4002b 68%, transparent 82%, #ff1f3d);
    animation: swirl 40s linear infinite; }
  .bg.custom::after { display: none; }
  @keyframes swirl { to { transform: rotate(360deg); } }
  .vignette { position: fixed; inset: 0; background:
    radial-gradient(ellipse 55% 60% at 45% 70%, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 55%, transparent 80%),
    radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.88) 100%); }
  #glass { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* brasas */
  .dust { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .dust i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgba(255,80,50,.85);
            box-shadow: 0 0 6px 1px rgba(255,60,40,.7); animation: float linear infinite; }
  .dust i:nth-child(3n) { background: rgba(120,255,110,.8); box-shadow: 0 0 6px 1px rgba(90,255,90,.6); }
  @keyframes float { from { transform: translateY(0); opacity: 0; } 20% { opacity: .9; } to { transform: translateY(-120vh); opacity: 0; } }

  main { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 2vh; padding: 16px; text-align: center; }

  .stage { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 3vw, 44px); }
  .frame { overflow: hidden; background: #120406; border-radius: 6px; border: 2px solid rgba(255,70,80,.9);
           box-shadow: 0 0 28px 4px rgba(255,40,60,.55), 0 0 80px 14px rgba(80,255,80,.2);
           animation: pulse 3.5s ease-in-out infinite; }
  .frame img { display: block; height: 100%; width: auto; max-width: 100%; object-fit: cover; }
  .throne { height: min(42vh, 62vw); }
  .side   { height: min(34vh, 50vw); transform: rotate(2deg); }
  @keyframes pulse { 50% { box-shadow: 0 0 40px 10px rgba(255,40,60,.75), 0 0 110px 26px rgba(80,255,80,.3); } }
  @media (max-width: 640px) { .stage { flex-direction: column; } .throne { height: 32vh; } .side { height: 22vh; } }

  h1 { font-size: clamp(20px, 3.6vw, 44px); letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
       text-shadow: 0 2px 20px rgba(0,0,0,.8); }

  .clock { display: flex; align-items: flex-start; gap: clamp(8px, 2vw, 28px); }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .num { font-size: clamp(44px, 9vw, 110px); font-weight: 600; line-height: 1; letter-spacing: .06em;
         font-variant-numeric: tabular-nums; text-shadow: 0 0 25px rgba(0,0,0,.7); }
  .num { display: grid; overflow: hidden; padding: .08em .12em; margin: -.08em -.12em; }
  .num span { grid-area: 1 / 1; text-align: center; }
  .num span.in  { animation: slideIn  .45s cubic-bezier(.22,.9,.3,1) both; }
  .num span.out { animation: slideOut .45s cubic-bezier(.22,.9,.3,1) both; }
  @keyframes slideIn  { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes slideOut { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
  .label { font-size: clamp(9px, 1.1vw, 14px); letter-spacing: .12em; font-weight: 700; text-transform: uppercase; opacity: .9; }
  .sep { font-size: clamp(36px, 7vw, 90px); font-weight: 600; line-height: 1.05; opacity: .9; }

  /* Portada de entrada: el primer toque desbloquea el audio del navegador */
  #gate { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 28px; cursor: pointer; background: rgba(2,6,3,.96); transition: opacity .8s ease; text-align: center; padding: 16px; }
  #gate.hide { opacity: 0; pointer-events: none; }
  #gate h2 { font-size: clamp(16px, 2.6vw, 30px); letter-spacing: .2em; text-transform: uppercase; font-weight: 700; text-shadow: 0 0 24px rgba(109,255,58,.5); }
  #gate .cover { position: relative; width: min(86vw, 620px); aspect-ratio: 1080 / 920; border-radius: 8px; overflow: hidden;
                 border: 2px solid rgba(255,70,80,.9); box-shadow: 0 0 40px 6px rgba(255,40,60,.55), 0 0 100px 20px rgba(80,255,80,.2);
                 animation: pulse 3s ease-in-out infinite; }
  #gate .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #gate .play { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; transform: translate(-50%, -50%);
                border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.35); backdrop-filter: blur(3px);
                border: 2px solid rgba(255,255,255,.75); transition: transform .2s ease, background .2s ease; }
  #gate .play svg { margin-left: 5px; opacity: .9; }
  #gate:hover .play { transform: translate(-50%, -50%) scale(1.08); background: rgba(0,0,0,.5); }
  /* Modo cumpleaños: gatitos por todos lados, confeti y mensaje */
  #cats, #confetti, #msg { display: none; }
  body.party #cats, body.party #confetti { display: block; }
  body.party #msg { display: block; }
  #cats { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #cats img { position: absolute; width: clamp(80px, 15vw, 230px); height: auto; border-radius: 12px;
              box-shadow: 0 0 24px rgba(255,60,90,.55); animation: bob 4s ease-in-out infinite; }
  #cats .c1 { left: 3%;  top: 6%;  --r: -8deg; }
  #cats .c2 { left: 2%;  top: 38%; --r: 6deg;  animation-delay: -1s; }
  #cats .c3 { left: 4%;  bottom: 5%; --r: -5deg; animation-delay: -2s; }
  #cats .c4 { right: 3%; top: 7%;  --r: 7deg;  animation-delay: -.5s; }
  #cats .c5 { right: 2%; top: 42%; --r: -6deg; animation-delay: -1.5s; }
  #cats .c6 { right: 4%; bottom: 5%; --r: 5deg; animation-delay: -2.5s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(var(--r)); } 50% { transform: translateY(-14px) rotate(calc(var(--r) * -1)); } }
  #confetti { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  #confetti i { position: absolute; top: -20px; width: 8px; height: 14px; opacity: .9; animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  #msg { max-width: min(900px, 90vw); font-size: clamp(13px, 2vw, 24px); font-weight: 700; letter-spacing: .1em; line-height: 1.5;
         text-transform: uppercase; text-shadow: 0 0 22px rgba(255,60,120,.85), 0 2px 12px rgba(0,0,0,.9); }
  body.party h1 { font-size: clamp(30px, 7vw, 90px); text-shadow: 0 0 30px rgba(255,60,120,.9), 0 2px 20px rgba(0,0,0,.8); }
  @media (max-width: 640px) { #cats img { width: 70px; opacity: .85; } #cats .c2, #cats .c5 { display: none; } }
  /* Fotos rebotando por toda la pantalla (modo cumpleaños) */
  #bounce { display: none; position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  body.party #bounce { display: block; }
  #bounce .bp { position: absolute; left: 0; top: 0; width: clamp(80px, 11vw, 160px); height: auto; padding: 5px; background: #fff; border-radius: 3px;
                box-shadow: 0 6px 20px rgba(0,0,0,.7), 0 0 22px rgba(255,60,100,.45); pointer-events: auto; cursor: zoom-in; will-change: transform; }
  #lightbox { position: fixed; inset: 0; z-index: 25; display: none; align-items: center; justify-content: center; padding: 3vh 3vw;
              background: rgba(0,0,0,.88); cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 94vw; max-height: 94vh; border: 8px solid #fff; border-radius: 4px; box-shadow: 0 0 60px rgba(255,60,100,.6); }
  body.party .throne { height: min(34vh, 56vw); }
  body.party .side { height: min(28vh, 44vw); }
  @media (max-width: 640px) {
    main { gap: 1.4vh; padding: 12px; }
    body.party .stage { gap: 10px; }
    body.party .throne { height: min(24vh, 62vw); }
    body.party .side { height: min(18vh, 46vw); }
    body.party h1 { font-size: clamp(24px, 8.5vw, 42px); }
    #msg { font-size: 12px; letter-spacing: .06em; }
    #bounce .bp { width: 62px; padding: 3px; }
    #cats img { width: 58px; }
    #lightbox { padding: 2vh 2vw; }
    #lightbox img { border-width: 5px; }
  }
  /* Candado: pide la contraseña mientras la página carga todo por detrás */
  #lock { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 26px; padding: 20px; text-align: center; background: rgba(2,6,3,.985); transition: opacity .6s ease; }
  #lock.hide { opacity: 0; pointer-events: none; }
  #lock h2 { font-size: clamp(15px, 2.4vw, 28px); letter-spacing: .18em; text-transform: uppercase; font-weight: 700; max-width: 900px; line-height: 1.5;
             text-shadow: 0 0 24px rgba(255,60,100,.6); }
  #lock form { display: flex; gap: 10px; width: min(92vw, 460px); }
  #lock input { flex: 1; min-width: 0; padding: 14px 18px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.55);
                background: rgba(255,255,255,.07); color: #fff; font: 600 16px 'Montserrat', sans-serif; letter-spacing: .25em; text-align: center; outline: none; }
  #lock input:focus { border-color: #ff4d7a; box-shadow: 0 0 18px rgba(255,60,100,.5); }
  #lock button { padding: 0 22px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.75); background: rgba(255,255,255,.1); color: #fff;
                 font: 700 14px 'Montserrat', sans-serif; cursor: pointer; }
  #lock button:hover { background: rgba(255,60,100,.35); }
  #lock .err { height: 18px; font-size: 13px; letter-spacing: .12em; color: #ff6b8a; font-weight: 600; }
  #lock.shake form { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  #snd { position: fixed; top: 16px; left: 16px; z-index: 5; display: flex; align-items: center; height: 44px;
         padding: 0 8px; border-radius: 999px; background: rgba(0,0,0,.45); backdrop-filter: blur(6px); }
  #vicon { background: none; border: 0; cursor: pointer; display: grid; place-items: center; padding: 4px; }
  #snd .w1, #snd .w2, #snd .x { display: none; }
  #snd.high .w1, #snd.high .w2, #snd.low .w1, #snd.off .x { display: inline; }
  #vol { -webkit-appearance: none; appearance: none; width: 0; opacity: 0; height: 4px; border-radius: 2px; cursor: pointer;
         margin: 0; outline: none; --p: 80%;
         background: linear-gradient(to right, #fff var(--p), rgba(255,255,255,.3) var(--p));
         transition: width .2s ease, opacity .2s ease, margin .2s ease; }
  #snd:hover #vol, #snd:focus-within #vol { width: 76px; opacity: 1; margin: 0 8px 0 4px; }
  @media (hover: none) { #vol { width: 76px; opacity: 1; margin: 0 8px 0 4px; } }
  #vol::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  #vol::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #fff; }
  .done h1 { font-size: clamp(28px, 6vw, 72px); }
</style>
</head>
<body>
  <div class="bg"></div>
  <canvas id="glass"></canvas>
  <div class="vignette"></div>
  <div class="dust" id="dust"></div>

  <div id="bounce">
    <img class="bp" src="fotos/foto1.webp" alt="">
    <img class="bp" src="fotos/foto2.webp" alt="">
    <img class="bp" src="fotos/foto3.webp" alt="">
    <img class="bp" src="fotos/foto4.webp" alt="">
    <img class="bp" src="fotos/foto5.webp" alt="">
    <img class="bp" src="fotos/foto6.webp" alt="">
    <img class="bp" src="fotos/foto7.webp" alt="">
    <img class="bp" src="fotos/foto8.webp" alt="">
  </div>
  <div id="lightbox"><img alt=""></div>
  <div id="cats">
    <img class="c1" src="gato1.png" alt="">
    <img class="c2" src="gato2.webp" alt="">
    <img class="c3" src="gato3.webp" alt="">
    <img class="c4" src="gato4.png" alt="">
    <img class="c5" src="gato5.png" alt="">
    <img class="c6" src="gato6.png" alt="">
  </div>
  <div id="confetti"></div>
  <div id="lock">
    <h2>Ingrese la contraseña que solo usted sabe</h2>
    <form id="lockForm" autocomplete="off">
      <input id="pw" type="password" aria-label="Contraseña" autofocus autocomplete="off">
      <button type="submit">Entrar</button>
    </form>
    <div class="err" id="lockErr"></div>
  </div>
  <div id="gate">
    <div class="cover">
      <img src="portada.webp" alt="">
      <div class="play"><svg width="44" height="44" viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5l13 7.5-13 7.5z"/></svg></div>
    </div>
    <h2>Pulsa aquí</h2>
  </div>
  <div id="snd" class="high">
    <button id="vicon" aria-label="Volume">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path class="sp" d="M3 9.5v5h4l5 4v-13l-5 4z" fill="#fff"/>
        <path class="w1" d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/>
        <path class="w2" d="M18 7a7 7 0 0 1 0 10"/>
        <path class="x" d="M16 9.5l5 5M21 9.5l-5 5"/>
      </svg>
    </button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
  </div>
  <main id="main">
    <div class="stage">
      <div class="frame throne"><img src="trono.jpg" alt="Micaela on the throne" onerror="this.style.display='none'"></div>
      <div class="frame side"><img src="foto.jpg" alt="Micaela" onerror="this.style.display='none'"></div>
    </div>
    <h1 id="title">Micaela's birthday is coming</h1>
    <div class="clock" id="clock">
      <div class="unit"><div class="num" id="mo">00</div><div class="label">Months</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="num" id="d">00</div><div class="label">Days</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="num" id="h">00</div><div class="label">Hours</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="num" id="m">00</div><div class="label">Minutes</div></div>
      <div class="sep">:</div>
      <div class="unit"><div class="num" id="s">00</div><div class="label">Seconds</div></div>
    </div>
    <p id="msg">Lo mejor a penas comienza, aún hay todo un día por delante con muchas sorpresas mi mor &lt;333</p>
  </main>

<script>
  // 28 de noviembre de 2026, 00:00 hora local (mes 10 = noviembre)
  const target = new Date(2026, 10, 28, 0, 0, 0);
  const pad = n => String(n).padStart(2, '0');
  const $ = id => document.getElementById(id);

  function tick() {
    const now = new Date();
    if (now >= target) {
      $('main').classList.add('done');
      $('title').textContent = "Feliz cumple mi mor!!!";
      document.body.classList.add('party'); startBounce();
      if (!$('confetti').children.length) {
        const cols = ['#ff3d6e', '#ffd23d', '#4dd2ff', '#7dff5a', '#c77dff', '#ff8a3d'];
        for (let i = 0; i < 70; i++) {
          const c = document.createElement('i');
          c.style.left = Math.random() * 100 + '%';
          c.style.background = cols[i % cols.length];
          c.style.animationDuration = (4 + Math.random() * 5) + 's';
          c.style.animationDelay = (-Math.random() * 9) + 's';
          $('confetti').appendChild(c);
        }
      }
      $('clock').style.display = 'none';
      stopAll();    // se acaba el reloj
      playFile();   // y empieza la canción
      return clearInterval(timer);
    }
    // meses calendario completos + resto
    let months = (target.getFullYear() - now.getFullYear()) * 12 + target.getMonth() - now.getMonth();
    let anchor = new Date(now); anchor.setMonth(now.getMonth() + months);
    if (anchor > target) { months--; anchor = new Date(now); anchor.setMonth(now.getMonth() + months); }
    let diff = Math.floor((target - anchor) / 1000);
    const d = Math.floor(diff / 86400); diff %= 86400;
    const h = Math.floor(diff / 3600);  diff %= 3600;
    const m = Math.floor(diff / 60);
    const s = diff % 60;
    setNum($('mo'), pad(months)); setNum($('d'), pad(d));
    setNum($('h'), pad(h)); setNum($('m'), pad(m)); setNum($('s'), pad(s));
  }
  // El número nuevo sube desde abajo y empuja al anterior hacia arriba
  function setNum(el, val) {
    const cur = el.querySelector('span:not(.out)');
    if (cur && cur.textContent === val) return;
    const next = document.createElement('span');
    next.textContent = val;
    if (!cur) el.textContent = '';   // quita el "00" inicial del HTML
    if (cur) {
      cur.classList.add('out');
      next.classList.add('in');
      setTimeout(() => cur.remove(), 500);
    }
    el.appendChild(next);
  }
  // Sonido: solo tick.mp3, en bucle SIN pausa. Se decodifica con Web Audio y se recorta el
  // silencio del inicio y del final para que al terminar vuelva a arrancar al instante.
  let muted = false, curVol = 0.8;
  let ctx = null, gain = null, src = null, buf = null, wantPlay = false, waState = 'loading';
  const song = new Audio('cancion.mp3');   // canción que suena el día del cumpleaños
  song.preload = 'auto';
  const tickFile = new Audio('tick.mp3');   // respaldo si Web Audio no puede cargar el archivo
  tickFile.loop = true; tickFile.preload = 'auto';

  function trimBounds(b) {
    const th = 0.01, n = b.length;
    const chs = Array.from({ length: b.numberOfChannels }, (_, i) => b.getChannelData(i));
    const loud = i => chs.some(c => Math.abs(c[i]) > th);
    let s = 0, e = n - 1;
    while (s < n && !loud(s)) s++;
    while (e > s && !loud(e)) e--;
    return [s / b.sampleRate, (e + 1) / b.sampleRate];
  }
  async function initWA() {
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      gain = ctx.createGain(); gain.gain.value = curVol; gain.connect(ctx.destination);
      const r = await fetch('tick.mp3');
      buf = await ctx.decodeAudioData(await r.arrayBuffer());
      waState = 'ok';
    } catch (e) { waState = 'fail'; }
    if (wantPlay) playFile();
  }
  function startWA() {
    if (src) return;
    const [ls, le] = trimBounds(buf);
    src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    src.loopStart = ls; src.loopEnd = le;
    src.connect(gain); src.start(0, ls);
  }
  function playFile() {
    if (document.body.classList.contains('party')) { song.play().catch(() => {}); return; }   // día del cumpleaños: suena la canción
    wantPlay = true;
    if (ctx) ctx.resume();
    if (waState === 'ok') startWA();
    else if (waState === 'fail') tickFile.play().catch(() => {});
  }
  function stopAll() {
    wantPlay = false;
    if (src) { try { src.stop(); } catch (e) {} src = null; }
    tickFile.pause();
  }

  // Los navegadores bloquean el audio hasta el primer toque: apenas haya cualquier interacción, arranca
  const events = ['pointerdown', 'keydown', 'touchstart', 'wheel'];
  function unlock() { playFile(); events.forEach(ev => window.removeEventListener(ev, unlock)); }
  events.forEach(ev => window.addEventListener(ev, unlock));

  // Control de volumen estilo YouTube: icono = mute/unmute, barra = volumen
  const snd = $('snd'), vol = $('vol');
  let lastVol = 0.8;
  function applyVolume(v) {
    v = Math.min(1, Math.max(0, v));
    curVol = v; muted = (v === 0); tickFile.volume = v; song.volume = v;
    if (gain) gain.gain.value = v;
    vol.value = v; vol.style.setProperty('--p', (v * 100) + '%');
    snd.className = v === 0 ? 'off' : v < 0.5 ? 'low' : 'high';
    if (v > 0) lastVol = v;
    try { localStorage.setItem('vol', String(v)); } catch (err) {}
  }
  vol.addEventListener('input', () => applyVolume(+vol.value));
  $('vicon').addEventListener('click', () => applyVolume(muted ? lastVol : 0));
  let saved = 0.8;
  try { const sv = localStorage.getItem('vol'); if (sv !== null) saved = +sv; } catch (e) {}
  applyVolume(saved);
  // Fotos rebotando como el protector de pantalla; clic = verla grande, se pausan mientras tanto
  function startBounce() {
    const items = Array.from(document.querySelectorAll('#bounce .bp'));
    if (!items.length || startBounce.done) return;
    startBounce.done = true;
    const W = () => innerWidth, H = () => innerHeight, k = innerWidth < 640 ? 0.55 : 1;   // más lentas en celular
    const st = items.map((el, i) => ({
      el, x: Math.random() * (W() - 160), y: Math.random() * (H() - 160),
      vx: (0.6 + Math.random() * 0.9) * (i % 2 ? 1 : -1), vy: (0.5 + Math.random() * 0.9) * (i % 3 ? 1 : -1), hover: false
    }));
    st.forEach(o => {
      o.el.addEventListener('mouseenter', () => o.hover = true);
      o.el.addEventListener('mouseleave', () => o.hover = false);
      o.el.addEventListener('click', () => {
        $('lightbox').firstElementChild.src = o.el.src;
        $('lightbox').classList.add('open');
      });
    });
    const lb = $('lightbox');
    lb.addEventListener('click', () => lb.classList.remove('open'));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
    function frame() {
      const paused = lb.classList.contains('open');
      st.forEach(o => {
        if (!paused && !o.hover) {
          const w = o.el.offsetWidth, h = o.el.offsetHeight;
          o.x += o.vx * k; o.y += o.vy * k;
          if (o.x <= 0) { o.x = 0; o.vx = Math.abs(o.vx); } else if (o.x + w >= W()) { o.x = W() - w; o.vx = -Math.abs(o.vx); }
          if (o.y <= 0) { o.y = 0; o.vy = Math.abs(o.vy); } else if (o.y + h >= H()) { o.y = H() - h; o.vy = -Math.abs(o.vy); }
        }
        o.el.style.transform = `translate(${o.x}px, ${o.y}px)`;
      });
      requestAnimationFrame(frame);
    }
    frame();
  }

  // Contraseña (se compara su huella SHA-256, sin guardar el texto) y precarga de todo mientras tanto
  const PW_HASH = 'c1e5e128e38d29152a9693f1e3d9b1fafcd121a59f4536f3c5da0f3b28c9f355';
  // SHA-256 en JS puro, por si el navegador no ofrece crypto.subtle (páginas no seguras)
  function sha256js(msg) {
    const K = []; let pc = 0;
    const H = [];
    for (let c = 2; pc < 64; c++) {
      let prime = true; for (let d = 2; d * d <= c; d++) if (c % d === 0) { prime = false; break; }
      if (prime) { if (pc < 8) H[pc] = (Math.pow(c, 1 / 2) % 1) * 4294967296 | 0; K[pc++] = (Math.pow(c, 1 / 3) % 1) * 4294967296 | 0; }
    }
    const bytes = Array.from(new TextEncoder().encode(msg)), bl = bytes.length * 8;
    bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
    for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (bl >>> (i * 8)) & 255);
    const rr = (v, a) => (v >>> a) | (v << (32 - a));
    for (let o = 0; o < bytes.length; o += 64) {
      const w = [];
      for (let i = 0; i < 16; i++) w[i] = (bytes[o + 4 * i] << 24) | (bytes[o + 4 * i + 1] << 16) | (bytes[o + 4 * i + 2] << 8) | bytes[o + 4 * i + 3];
      for (let i = 16; i < 64; i++) {
        const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let [a, b, c, d, e, f, g, h] = H;
      for (let i = 0; i < 64; i++) {
        const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g), t1 = (h + S1 + ch + K[i] + w[i]) | 0;
        const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), mj = (a & b) ^ (a & c) ^ (b & c), t2 = (S0 + mj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
  }
  async function sha256(t) {
    if (window.crypto && crypto.subtle) {
      const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
      return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    return sha256js(t);
  }
  $('lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    let ok = false;
    try { ok = (await sha256($('pw').value.trim().toUpperCase())) === PW_HASH; } catch (err) {}
    if (ok) {
      $('lock').classList.add('hide');
      setTimeout(() => $('lock').remove(), 700);
    } else {
      $('lockErr').textContent = 'Contraseña incorrecta';
      $('lock').classList.remove('shake'); void $('lock').offsetWidth; $('lock').classList.add('shake');
      $('pw').select();
    }
  });
  setTimeout(() => { const pw = $('pw'); if (pw) pw.focus(); }, 100);
  // precarga: imágenes y audios se descargan ahora, así todo está listo al entrar
  ['trono.jpg', 'foto.jpg', 'portada.webp', 'fondo.jpg', 'gato1.png', 'gato2.webp', 'gato3.webp', 'gato4.png', 'gato5.png', 'gato6.png']
    .concat(Array.from({ length: 8 }, (_, i) => `fotos/foto${i + 1}.webp`))
    .forEach(u => { const im = new Image(); im.src = u; });
  ['cancion.mp3', 'tick.mp3'].forEach(u => fetch(u).catch(() => {}));

  // Portada: el toque inicial arranca el reloj y abre la página
  $('gate').addEventListener('click', () => {
    playFile();
    $('gate').classList.add('hide');
    setTimeout(() => $('gate').remove(), 900);
  });
  document.addEventListener('keydown', e => { if ($('gate') && (e.key === 'Enter' || e.key === ' ')) $('gate').click(); });
  initWA();
  wantPlay = true;   // si el navegador lo permite, suena apenas carga

  const timer = setInterval(tick, 1000); tick();

  // Vitral gótico verde procedural (ventanas ojivales con paneles de colores y plomo negro)
  (function () {
    const cv = $('glass'), g = cv.getContext('2d');
    let seed = 7;
    const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    function draw() {
      seed = 7;
      const W = cv.width = innerWidth, H = cv.height = innerHeight;
      const w = Math.max(64, W / 24), h = w * 2.6, gx = W * 0.8, gy = H * 0.3, sig = Math.max(W, H) * 0.32;
      g.fillStyle = '#031006'; g.fillRect(0, 0, W, H);
      const lead = Math.max(2, w * 0.045);
      for (let row = -1; row * h < H + h; row++) {
        for (let col = -1; col * w < W + w; col++) {
          const x = col * w, y = row * h, top = y + w * 0.6;
          g.save();
          g.beginPath();
          g.moveTo(x, y + h); g.lineTo(x, top);
          g.quadraticCurveTo(x, y + w * 0.12, x + w / 2, y);
          g.quadraticCurveTo(x + w, y + w * 0.12, x + w, top);
          g.lineTo(x + w, y + h); g.closePath();
          g.clip();
          // paneles: 3 tiras verticales cortadas en tramos al azar
          const strips = [0, 0.18, 0.4, 0.6, 0.82, 1];
          for (let i = 0; i < 5; i++) {
            let yy = y;
            while (yy < y + h) {
              const ph = h * (0.05 + rnd() * 0.12);
              const cx = x + w * (strips[i] + strips[i + 1]) / 2, cy = yy + ph / 2;
              const glow = Math.exp(-((cx - gx) ** 2 + (cy - gy) ** 2) / (2 * sig * sig));
              const red = rnd() < 0.07;
              const hue = red ? 350 + rnd() * 12 : 62 + rnd() * 110;     // amarillo-verde a verde azulado
              const sat = 55 + rnd() * 30;
              const light = 8 + rnd() * 16 + glow * (34 + rnd() * 26);
              const L = Math.min(light, 80), pw = w * (strips[i + 1] - strips[i]);
              const gr = g.createLinearGradient(0, yy, 0, yy + ph);
              gr.addColorStop(0, `hsl(${hue % 360},${sat}%,${Math.min(L + 8, 85)}%)`);
              gr.addColorStop(1, `hsl(${hue % 360},${sat}%,${Math.max(L - 8, 4)}%)`);
              g.fillStyle = gr;
              g.fillRect(x + w * strips[i], yy, pw, ph + 1);
              yy += ph;
            }
          }
          g.restore();
          // plomo negro: contorno + divisiones
          g.strokeStyle = '#020a04'; g.lineWidth = lead * 1.6;
          g.beginPath();
          g.moveTo(x, y + h); g.lineTo(x, top);
          g.quadraticCurveTo(x, y + w * 0.12, x + w / 2, y);
          g.quadraticCurveTo(x + w, y + w * 0.12, x + w, top);
          g.lineTo(x + w, y + h); g.stroke();
          g.lineWidth = lead;
          g.beginPath();
          for (const f of [0.18, 0.4, 0.6, 0.82]) { g.moveTo(x + w * f, y + w * 0.25); g.lineTo(x + w * f, y + h); }
          g.stroke();
        }
      }
      // luz intensa al fondo derecho, como la del reloj original
      const rg = g.createRadialGradient(gx, gy, 0, gx, gy, sig * 0.9);
      rg.addColorStop(0, 'rgba(235,255,170,.55)'); rg.addColorStop(1, 'rgba(235,255,170,0)');
      g.fillStyle = rg; g.fillRect(0, 0, W, H);
    }
    draw();
    // Si pones fondo.jpg en la carpeta, reemplaza al vitral generado
    const bgImg = new Image();
    bgImg.onload = () => { cv.style.display = 'none'; document.querySelector('.bg').classList.add('custom'); };
    bgImg.src = 'fondo.jpg';
    let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(draw, 150); });
  })();

  // partículas
  const dust = $('dust');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + '%';
    p.style.top = (60 + Math.random() * 50) + '%';
    p.style.animationDuration = (10 + Math.random() * 14) + 's';
    p.style.animationDelay = (-Math.random() * 20) + 's';
    dust.appendChild(p);
  }
</script>
</body>
</html>
